[package]
name = "engine"
version = "0.1.0"
edition = "2024"

[dependencies]
base64 = "=0.22.1"
ed25519-dalek = { version = "=2.1.1", features = ["rand_core"] }
rand_core = { version = "=0.6.4", features = ["getrandom"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sysinfo = "0.39.6"
ureq = "=2.10.1"
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_System_Threading", "Win32_Security", "Win32_System_Performance", "Win32_Media"] }
winreg = "0.56.0"

[dev-dependencies]
tempfile = "3.27.0"
